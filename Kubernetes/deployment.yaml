apiVersion: apps/v1
kind: Deployment
metadata:
  name: gift-agent-backend
  labels:
    app: gift-agent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gift-agent-backend
  template:
    metadata:
      labels:
        app: gift-agent-backend
    spec:
      # ✅ Use your correct Kubernetes service account
      serviceAccountName: gift-agent-ksa

      containers:
        - name: backend
          image: asia-south1-docker.pkg.dev/gift-list-agent/gift-agent-repo/gift-agent:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          env:
            # ✅ FastAPI + Vertex AI authentication inside container
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json

          volumeMounts:
            # 🔑 Mount the Google SA key file
            - name: gcp-key
              mountPath: /var/secrets/google
              readOnly: true

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "0.5"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

      # 🔐 Attach secret containing the Google SA key
      volumes:
        - name: gcp-key
          secret:
            secretName: gift-agent-sa-key
